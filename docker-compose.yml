services:
  backdrop:
    build:
      context: .
      dockerfile: Dockerfile
    image: backdrop-replace:local
    ports:
      - "8000:8000"
    # Samples live in this process's memory; run exactly one worker so both
    # slots are always shared. Restarting the container drops them.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
